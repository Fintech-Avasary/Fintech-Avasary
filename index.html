<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avasary</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --ink: #23302b;
      --muted: #5c6b64;
      --accent: #1f6f54;
      --line: #d8d3c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 24px 0 8px; font-size: 1rem; }
    p { margin: 4px 0; }
    ul { margin: 0; padding-left: 20px; }
    fieldset { margin: 24px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; }
    legend { padding: 0 4px; font-weight: 600; }
    label { display: block; padding: 6px 0; cursor: pointer; }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <section id="waiting-room">
      <h1>Maple Street Block</h1>
      <p class="muted">Waiting room: the Workday starts when the Mayor is ready.</p>

      <h2>Residents here</h2>
      <ul>
        <li>Resident A</li>
        <li>Resident B</li>
        <li>Resident C</li>
      </ul>

      <form id="start-form">
        <fieldset>
          <legend>Mayor: emergencies this Workday</legend>
          <label><input type="radio" name="emergency" value="off"> Off (never happens)</label>
          <label><input type="radio" name="emergency" value="sometimes" checked> Sometimes (50% chance)</label>
          <label><input type="radio" name="emergency" value="always"> Always</label>
        </fieldset>
        <button type="submit">Start Workday</button>
      </form>
    </section>

    <section id="workday" hidden>
      <h1>Workday started</h1>
      <p>Emergency setting: <strong id="emergency-setting"></strong></p>
      <p class="muted">Round 1 questions come next.</p>
    </section>
  </main>

  <script>
    const game = { emergencySetting: null };

    // §4: the Mayor starts the Workday from the waiting room. §12: emergency setting is Mayor-controlled.
    document.getElementById('start-form').addEventListener('submit', (event) => {
      event.preventDefault();
      game.emergencySetting = new FormData(event.target).get('emergency');
      document.getElementById('emergency-setting').textContent = game.emergencySetting;
      document.getElementById('waiting-room').hidden = true;
      document.getElementById('workday').hidden = false;
    });
  </script>
</body>
</html>
